<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quant Radar — Four-Tier Alert Engine &amp; Gating State Machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-paper-2: #ffffff;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.08);
      --color-rule-solid: #cbd5e1;
      --color-accent:  #ea580c;
      --color-link:    #2563eb;
      --font-sans:     'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, SFMono-Regular, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1080px; width: 100%; }
    .diagram-container {
      width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule-solid);
      border-radius: 8px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      padding: 1.5rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.5vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 800px;
      line-height: 1.5;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; box-shadow: none; border: none; padding: 0; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Rule Engine · State Machine Specification</p>
    <h1>Four-Tier Alert Engine &amp; Anti-Bombardment Gating</h1>
    <p class="subtitle">Deterministic rule-driven evaluation: multi-condition boolean composition, 30-minute anti-bombardment cooling, daily frequency caps, state persistence, and dual-channel dispatch.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alert-gate-title alert-gate-desc">
        <title id="alert-gate-title">Four-Tier Alert Engine and Gating State Machine</title>
        <desc id="alert-gate-desc">State diagram illustrating tick event arrival, boolean condition evaluation, cooldown verification, daily cap check, and event dispatch.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea580c"/></marker>
          <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#16a34a"/></marker>
          <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#dc2626"/></marker>
        </defs>

        <rect width="960" height="520" fill="#ffffff" rx="6"/>

        <!-- Inflow Node: Real-time Tick Event -->
        <rect x="30" y="50" width="160" height="70" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
        <text x="44" y="74" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Tick Event Inflow</text>
        <text x="44" y="91" font-family="'Geist Mono', monospace" font-size="10" fill="#475569">price, pct_chg, vol</text>
        <text x="44" y="104" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">turnover, high, low</text>

        <!-- Arrow: Tick -> Gate 1 -->
        <line x1="190" y1="85" x2="240" y2="85" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Gate 1: Condition Evaluator -->
        <rect x="240" y="35" width="230" height="100" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text x="254" y="58" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Tier 1 · Rule Matcher</text>
        <text x="254" y="75" font-family="'Geist Mono', monospace" font-size="10" fill="#475569">Composite Logic Engine</text>
        <text x="254" y="90" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">• Single: |pct| ≥ threshold</text>
        <text x="254" y="103" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">• Group: (pct ≥ 5% AND to ≥ 8%)</text>
        <text x="254" y="118" font-family="'Geist Mono', monospace" font-size="9" fill="#ea580c">Condition Satisfied?</text>

        <!-- Arrow: False -> Drop -->
        <line x1="355" y1="135" x2="355" y2="185" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
        <text x="365" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#dc2626">NO (Silent Ignore)</text>
        <rect x="300" y="185" width="110" height="32" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="312" y="205" font-family="'Geist Mono', monospace" font-size="10" fill="#991b1b">DROP EVENT</text>

        <!-- Arrow: True -> Gate 2 -->
        <line x1="470" y1="85" x2="520" y2="85" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
        <text x="478" y="77" font-family="'Geist Mono', monospace" font-size="10" fill="#16a34a">YES</text>

        <!-- Gate 2: Cooldown Gate -->
        <rect x="520" y="35" width="200" height="100" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text x="534" y="58" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Tier 2 · Cooldown Gate</text>
        <text x="534" y="75" font-family="'Geist Mono', monospace" font-size="10" fill="#475569">Anti-Bombardment</text>
        <text x="534" y="90" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">now - last_triggered &gt; 30m</text>
        <text x="534" y="103" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">Isolated per ticker</text>
        <text x="534" y="118" font-family="'Geist Mono', monospace" font-size="9" fill="#ea580c">Cooldown Expired?</text>

        <!-- Arrow: In Cooldown -> Suppress -->
        <line x1="620" y1="135" x2="620" y2="185" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
        <text x="630" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#dc2626">NO (In Cooling)</text>
        <rect x="555" y="185" width="130" height="32" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="568" y="205" font-family="'Geist Mono', monospace" font-size="10" fill="#991b1b">SUPPRESS ALERT</text>

        <!-- Arrow: Cooldown OK -> Gate 3 -->
        <line x1="720" y1="85" x2="760" y2="85" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
        <text x="726" y="77" font-family="'Geist Mono', monospace" font-size="10" fill="#16a34a">YES</text>

        <!-- Gate 3: Daily Cap Gate -->
        <rect x="760" y="35" width="170" height="100" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
        <text x="774" y="58" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#ea580c">Tier 3 · Daily Quota</text>
        <text x="774" y="75" font-family="'Geist Mono', monospace" font-size="10" fill="#475569">Daily Limit Gate</text>
        <text x="774" y="90" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">count &lt; 5 per trading day</text>
        <text x="774" y="103" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">Resets at 09:00 CST</text>
        <text x="774" y="118" font-family="'Geist Mono', monospace" font-size="9" fill="#ea580c">Under Cap?</text>

        <!-- Arrow: Over Cap -> Exhausted -->
        <line x1="845" y1="135" x2="845" y2="185" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
        <text x="855" y="162" font-family="'Geist Mono', monospace" font-size="10" fill="#dc2626">NO (Cap Reached)</text>
        <rect x="785" y="185" width="125" height="32" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text x="797" y="205" font-family="'Geist Mono', monospace" font-size="10" fill="#991b1b">DAILY CAP EXHAUST</text>

        <!-- Route Down to Tier 4: Execution & Persistence -->
        <path d="M 930 85 L 945 85 L 945 280 L 880 280" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-green)"/>
        <text x="890" y="270" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#16a34a">PERMITTED</text>

        <!-- Tier 4 Container: Execution & Persistence -->
        <rect x="30" y="250" width="850" height="230" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="48" y="274" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#0f172a" letter-spacing="0.06em">TIER 4 · STATE PERSISTENCE &amp; MULTI-CHANNEL DISPATCH</text>

        <!-- Step 4.1: State Persistence -->
        <rect x="50" y="290" width="240" height="90" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
        <text x="64" y="312" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#ea580c">1. Persistent State Commit</text>
        <text x="64" y="329" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">alert_state.json write</text>
        <text x="64" y="344" font-family="'Geist Mono', monospace" font-size="9" fill="#475569">• last_trigger = timestamp</text>
        <text x="64" y="358" font-family="'Geist Mono', monospace" font-size="9" fill="#475569">• daily_count += 1</text>
        <text x="64" y="371" font-family="'Geist Mono', monospace" font-size="9" fill="#16a34a">Survives server restart</text>

        <!-- Arrow: 4.1 -> 4.2 -->
        <line x1="290" y1="335" x2="340" y2="335" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Step 4.2: In-Memory Event Construction -->
        <rect x="340" y="290" width="230" height="90" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <text x="354" y="312" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#0f172a">2. Envelope Synthesis</text>
        <text x="354" y="329" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">Structured Alert Event</text>
        <text x="354" y="344" font-family="'Geist Mono', monospace" font-size="9" fill="#475569">• code, name, trigger_price</text>
        <text x="354" y="358" font-family="'Geist Mono', monospace" font-size="9" fill="#475569">• rule_id, trigger_reason</text>
        <text x="354" y="371" font-family="'Geist Mono', monospace" font-size="9" fill="#475569">• current_pct, turnover_rate</text>

        <!-- Arrow: 4.2 -> Dispatch Branches -->
        <line x1="570" y1="335" x2="620" y2="335" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Step 4.3: Dispatch Channels -->
        <rect x="620" y="280" width="240" height="60" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
        <text x="634" y="300" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2563eb">Channel A · WebSocket Broadcast</text>
        <text x="634" y="316" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">BroadcastManager.broadcast()</text>
        <text x="634" y="330" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">Instant sound chime &amp; badge highlight</text>

        <rect x="620" y="350" width="240" height="60" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
        <text x="634" y="370" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16a34a">Channel B · External Webhook</text>
        <text x="634" y="386" font-family="'Geist Mono', monospace" font-size="10" fill="#0f172a">Feishu / WeCom / PushPlus</text>
        <text x="634" y="400" font-family="'Geist Mono', monospace" font-size="9" fill="#64748b">Asynchronous resilient POST request</text>

        <!-- Footer status bar -->
        <rect x="50" y="420" width="810" height="42" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="65" y="445" font-family="'Geist Mono', monospace" font-size="10" fill="#475569">STATUS: 100% Deterministic · Zero LLM Dependency · Zero False Positives · Memory-Bounded</text>
      </svg>
    </div>
  </div>
</body>
</html>
